# For Coolify (or plain `docker compose up`). Secrets come from the
# environment at runtime -- nothing sensitive belongs in this file.
services:
  edgefund:
    build: .
    restart: unless-stopped
    # The container always listens on 8000. Only the *host* side is
    # configurable, because a busy Coolify box usually has 8000 taken already
    # (Coolify's own proxy owns 80/443, and other stacks tend to grab 8000/8080).
    # Set DASHBOARD_PORT to any free host port, or delete this ports: block
    # entirely and route through Coolify's proxy with SERVICE_FQDN_EDGEFUND_8000.
    ports:
      - "${DASHBOARD_PORT:-8317}:8000"
    expose:
      - "8000"
    environment:
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ALPACA_TRADING_BASE: https://paper-api.alpaca.markets
      ALPACA_DATA_BASE: https://data.alpaca.markets
      OPTIONS_FEED: indicative
      HIST_FEED: sip
      LIVE_FEED: iex
      DRY_RUN: ${DRY_RUN:-false}
      SIZE_RAMP: ${SIZE_RAMP:-0.15}
      DB_PATH: data_store/edgefund.db
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      TZ: America/New_York
    volumes:
      - edgefund_data:/app/data_store
volumes:
  edgefund_data:
